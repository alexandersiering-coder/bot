services:
  - type: web
    name: alesie-telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: SYSTEM_PROMPT
        value: Du bist ein hilfsbereiter Assistent in einem Telegram-Chat. Antworte knapp und in der Sprache des Nutzers.
      - key: HISTORY_TURNS
        value: "10"
      - key: ALLOWED_USER_IDS
        sync: false
      - key: ALLOWED_CHAT_IDS
        sync: false
      - key: BOT_NAME_TRIGGER
        value: Kollege
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: BRING_MCP_URL
        sync: false
      - key: BRING_MCP_TOKEN
        sync: false
      - key: VISION_MODEL
        value: qwen/qwen3.6-27b
      - key: VOICE_MODEL
        value: whisper-large-v3-turbo
      - key: VOICE_LANGUAGE
        value: de
      - key: DATABASE_URL
        sync: false
      - key: TIMEZONE
        value: Europe/Berlin
      - key: RECIPE_API_KEY
        sync: false
      - key: PROACTIVE_INTERVAL_HOURS
        value: "0"
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
